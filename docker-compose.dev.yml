version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: restaurant-db-dev
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevPassword123!
      - MSSQL_PID=Express
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-dev-data:/var/opt/mssql
    networks:
      - restaurant-dev-network

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: restaurant-app-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=RestaurantManager;User Id=sa;Password=DevPassword123!;TrustServerCertificate=True;
    ports:
      - "5001:8080"
    volumes:
      - .:/src
      - /src/src/RestaurantManager.Web/bin
      - /src/src/RestaurantManager.Web/obj
    depends_on:
      - sqlserver
    networks:
      - restaurant-dev-network

volumes:
  sqlserver-dev-data:

networks:
  restaurant-dev-network:
    driver: bridge
