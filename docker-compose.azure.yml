version: '3.8'

services:
  # Restaurant Manager Web Application (Azure SQL)
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-app
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True;
    ports:
      - "5000:8080"
    networks:
      - restaurant-network
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  restaurant-network:
    driver: bridge
